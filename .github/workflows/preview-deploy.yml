name: My ARTfive! Preview Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-artfive-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy isolated Preview Worker
    runs-on: ubuntu-latest
    environment:
      name: preview
    steps:
      - name: Check out the approved Preview source branch
        uses: actions/checkout@v4
        with:
          ref: feature/google-play-store-preparation

      - name: Verify Preview source and isolated Wrangler configuration
        run: |
          echo "Preview source branch: $(git branch --show-current)"
          echo "Preview source commit: $(git rev-parse HEAD)"
          test -f wrangler.jsonc || { echo "::error::wrangler.jsonc is missing from the Preview source branch."; exit 1; }
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            const preview = config.env && config.env.preview;
            if (!preview || preview.name !== "my-artfive-railway-assistant-preview") {
              console.error("Preview Worker name is missing or incorrect.");
              process.exit(1);
            }
            if (!Array.isArray(preview.d1_databases) ||
                preview.d1_databases.length !== 1 ||
                preview.d1_databases[0].database_id !== "4b370760-55cf-43cb-87f3-c3ab97fe94f1") {
              console.error("Preview D1 binding is missing or does not match the isolated Preview database.");
              process.exit(1);
            }
            console.log("Verified Preview Worker and Preview D1 database. Production configuration was not selected.");
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."; exit 1; }

      - name: Deploy isolated Preview Worker and print URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.165.0 deploy --env preview --config wrangler.jsonc
